name: Liquisto mail offline

on:
  pull_request:
    paths:
      - .github/workflows/liquisto-mail-offline.yml
      - requirements*.txt
      - src/api/routes/liquisto_mail.py
      - src/api/services/liquisto_mail*.py
      - src/api/services/liquisto_openai_budget.py
      - tests/test_api/test_liquisto_mail*.py
      - tests/test_api/test_liquisto_regular_mail_openai.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquisto-mail-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regular-mail-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install test dependencies from the official index
        run: >-
          python -m pip install --index-url https://pypi.org/simple
          --requirement requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
          aiosqlite==0.22.1 ruff==0.15.20
      - name: Check regular provider and export denial contracts offline
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest tests/test_api/test_liquisto_mail_data.py
          tests/test_api/test_liquisto_regular_mail_openai.py -q
      - name: Check Python lint
        run: python -m ruff check src tests
