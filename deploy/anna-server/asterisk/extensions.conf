[from-easybell]
exten => _X!,1,NoOp(Inbound call for Anna)
 ; Easybell can briefly retain several registration bindings after a gateway
 ; restart and fork the same PSTN call to each binding. Only the first channel
 ; may reach the single-call Anna worker; duplicate forks keep ringing until
 ; the provider cancels them after the first channel answers.
 same => n,Set(GROUP()=anna-inbound)
 same => n,GotoIf($[${GROUP_COUNT(anna-inbound)}>1]?duplicate)
 ; Resolve the live contact registered on Anna's configured AOR. Dialing the
 ; endpoint name directly assumes an identically named AOR and can return busy
 ; even while Anna is registered under a separate AOR.
 same => n,Dial(${PJSIP_DIAL_CONTACTS(anna)},30)
 same => n,Hangup()
 same => n(duplicate),Ringing()
 same => n,Wait(30)
 same => n,Hangup()

[from-anna]
; Anna has no outbound dialing permission.
exten => _X!,1,Hangup()
