# Include inside the existing TLS server block; preserve its location / verbatim.
location ^~ /anna-calendar/auth/microsoft/ {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8735/auth/microsoft/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}
location = /anna-calendar/health {
    proxy_pass http://127.0.0.1:8735/health;
}
location /anna-calendar/ {
    return 404;
}
